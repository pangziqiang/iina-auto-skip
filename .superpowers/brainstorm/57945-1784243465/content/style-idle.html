<h2>OSD 覆盖层 — 非活跃状态</h2>
<p class="subtitle">3 秒不操作自动淡化，只保留手柄和时间标签</p>

<div class="split">

  <div class="mockup" style="background: #1a1a2e; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 16/9;">
    <div style="position: absolute; inset: 0; background: linear-gradient(135deg, #16213e, #0f3460, #1a1a2e); display: flex; align-items: center; justify-content: center;">
      <div style="width: 80px; height: 80px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.15); font-size: 32px;">▶</div>
    </div>

    <!-- Idle OSD - just handles and labels -->
    <div style="position: absolute; bottom: 28px; left: 10%; right: 10%; transition: opacity 0.5s;">

      <!-- Faded track -->
      <div style="position: absolute; top: 8px; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px;"></div>
      <div style="position: absolute; top: 8px; left: 12%; width: 60%; height: 3px; background: rgba(230, 126, 34, 0.2); border-radius: 2px;"></div>

      <!-- Faded handles (smaller) -->
      <div style="position: absolute; top: 5px; left: 12%; width: 10px; height: 10px; background: rgba(230,126,34,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; transform: translateX(-50%);"></div>
      <div style="position: absolute; top: 5px; left: 72%; width: 10px; height: 10px; background: rgba(230,126,34,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; transform: translateX(-50%);"></div>

      <!-- Time labels visible -->
      <div style="position: absolute; top: 18px; left: 12%; transform: translateX(-50%); font-size: 10px; color: rgba(230,126,34,0.5); white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,0.4);">
        00:01:30
      </div>
      <div style="position: absolute; top: 18px; left: 72%; transform: translateX(-50%); font-size: 10px; color: rgba(230,126,34,0.5); white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,0.4);">
        00:43:15
      </div>
    </div>
  </div>

  <div class="mockup" style="background: #1a1a2e; border-radius: 12px; overflow: hidden; position: relative; aspect-ratio: 16/9;">
    <div style="position: absolute; inset: 0; background: linear-gradient(135deg, #16213e, #0f3460, #1a1a2e); display: flex; align-items: center; justify-content: center;">
      <div style="width: 80px; height: 80px; border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.15); font-size: 32px;">▶</div>
    </div>
    <!-- Hidden state -->
    <div style="position: absolute; bottom: 28px; left: 10%; right: 10%; text-align: center;">
      <div style="font-size: 10px; color: rgba(255,255,255,0.15);">
        鼠标移入即可调整
      </div>
    </div>
  </div>

</div>

<div style="text-align: center; margin: 8px 0 0; font-size: 12px; color: #888;">
  <span style="display: inline-block; margin: 0 12px;">← 半透明淡化 (3s 不操作)</span>
  <span style="display: inline-block; margin: 0 12px;">← 完全隐藏 (再等 5s)</span>
</div>

<div class="options" style="margin-top: 32px;">
  <div class="option" data-choice="good" onclick="toggleSelect(this)">
    <div class="letter">👌</div>
    <div class="content">
      <h3>风格可以</h3>
      <p>就这样推进设计</p>
    </div>
  </div>
  <div class="option" data-choice="tweak" onclick="toggleSelect(this)">
    <div class="letter">🔄</div>
    <div class="content">
      <h3>细节想调整</h3>
      <p>说说你的想法</p>
    </div>
  </div>
</div>
