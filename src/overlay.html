<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <div id="osd-container">
        <div class="osd-center-hint" data-clickable>按 ESC 关闭（不保存）</div>
        <div class="osd-header" data-clickable>
            <span class="title">拖动 <b style="color:#40a9ff">I(片头)</b> 和 <b style="color:#ffb340">O(片尾)</b> 设置跳过区间</span>
        </div>

        <div class="osd-track-area" id="osdTrackArea" data-clickable>
            <div class="osd-track" id="osdTrack"></div>
            <div class="osd-track-fill" id="osdTrackFill"></div>
            <div class="osd-playhead" id="osdPlayhead"></div>
            <div class="osd-handle osd-handle-intro" id="osdHandleIntro" data-clickable></div>
            <div class="osd-handle osd-handle-outro" id="osdHandleOutro" data-clickable></div>
            <div class="osd-time-label osd-label-intro" id="osdLabelIntro">00:00:00</div>
            <div class="osd-time-label osd-label-outro" id="osdLabelOutro">00:00:00</div>
            <div class="osd-handle-label" id="osdLabelIntroTag">片头</div>
            <div class="osd-handle-label" id="osdLabelOutroTag">片尾</div>
        </div>

        <div class="osd-bottom" id="osd-bottom">
            <div class="osd-time-info">
                <span id="osdCurrentTime">00:00:00</span>
                <span class="sep">/</span>
                <span id="osdDuration">00:00:00</span>
            </div>
            <div class="osd-btns">
                <button class="osd-btn" id="osdBtnCancel" data-clickable>取消</button>
                <button class="osd-btn osd-btn-save" id="osdBtnSave" data-clickable>保存</button>
            </div>
        </div>

        <div class="osd-empty-state" id="osdEmpty" style="display:none" data-clickable>暂无视频</div>
    </div>

    <div class="osd-hidden-hint" id="osdHiddenHint">鼠标移入即可调整</div>

    <script src="overlay.js"></script>
</body>
</html>
