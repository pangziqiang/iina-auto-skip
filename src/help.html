<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="preferences.css">
    <script src="i18n.js"></script>
    <style>
        @media (prefers-color-scheme: dark) {
            html { color-scheme: dark; color: #eee; }
        }
        html, body { margin: 0; }
        body { padding: 10px; }
        ul { padding-left: 20px; margin-bottom: 16px; }
        li { margin-bottom: 6px; }
        kbd {
            background: rgba(128, 128, 128, 0.15);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: "SF Mono", "Menlo", monospace;
            font-size: 0.9em;
        }
        strong { font-weight: 600; }
    </style>
</head>
<body>
    <div class="form-row">
        <label><b data-i18n="help.usage"></b></label>
        <div class="help-text" style="margin-bottom: 12px;" data-i18n="help.usageDesc"></div>
        <ul>
            <li data-i18n="help.menu1"></li>
            <li data-i18n="help.menu2"></li>
        </ul>
    </div>

    <div class="form-row" style="margin-top: 20px;">
        <label><b data-i18n="help.features"></b></label>
        <ul>
            <li data-i18n="help.feature1"></li>
            <li data-i18n="help.feature2"></li>
            <li data-i18n="help.feature3"></li>
        </ul>
    </div>

    <div class="form-row" style="margin-top: 20px;">
        <label><b data-i18n="help.shortcuts"></b></label>
        <ul>
            <li data-i18n="help.shortcut1"></li>
            <li data-i18n="help.shortcut2"></li>
        </ul>
    </div>

    <div class="form-row" style="margin-top: 20px;">
        <label><b data-i18n="help.skipDesc"></b></label>
        <ul>
            <li data-i18n="help.introDesc"></li>
            <li data-i18n="help.outroDesc"></li>
        </ul>
        <div class="help-text" style="margin-top: 8px;" data-i18n="help.inputHint"></div>
        <div class="help-text" style="margin-top: 8px;" data-i18n="help.visualHint"></div>
    </div>

    <script>translatePage()</script>
</body>
</html>
