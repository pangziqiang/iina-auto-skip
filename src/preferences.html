<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="preferences.css">
    <script src="i18n.js"></script>
</head>
<body>
    <div class="form-row">
        <label for="keybindInput" data-i18n="pref.sidebarKey"></label>
        <input type="text" id="keybindInput" data-type="string" placeholder="s" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off">
        <div class="info-box warning" id="validationInfo">...</div>
    </div>

    <div class="form-row">
        <label for="overlayKeybindInput" data-i18n="pref.overlayKey"></label>
        <input type="text" id="overlayKeybindInput" data-type="string" placeholder="a" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off">
        <div class="info-box warning" id="overlayValidationInfo">...</div>
    </div>

    <div class="form-row">
        <div class="small secondary help-text" data-i18n="pref.restartHint"></div>
    </div>

    <div class="form-row">
        <div class="toggle-row">
            <label class="toggle-label" data-i18n="pref.autoFocus"></label>
            <label class="switch">
                <input type="checkbox" id="autoFocusToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="help-text" data-i18n="pref.autoFocusHint"></div>
    </div>

    <script>translatePage()</script>
    <script src="preferences.js"></script>
</body>
</html>
