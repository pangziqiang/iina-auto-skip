<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="settings.css">
    <script src="i18n.js"></script>
</head>
<body>
    <div class="top-content">
        <div class="section">
            <div class="section-title" data-i18n="settings.title"></div>
            <div class="toggle-row">
                <label class="toggle-label" data-i18n="settings.enable"></label>
                <label class="switch">
                    <input type="checkbox" id="enableToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="section">
            <div class="section-title" data-i18n="settings.intro"></div>
            <div class="time-row">
                <input type="text" class="time-box" id="introH" placeholder="0" inputmode="numeric">
                <span class="time-sep">:</span>
                <input type="text" class="time-box" id="introM" placeholder="0" inputmode="numeric">
                <span class="time-sep">:</span>
                <input type="text" class="time-box" id="introS" placeholder="0" inputmode="numeric">
            </div>
        </div>

        <div class="section">
            <div class="section-title" data-i18n="settings.outro"></div>
            <div class="time-row">
                <input type="text" class="time-box" id="outroH" placeholder="0" inputmode="numeric">
                <span class="time-sep">:</span>
                <input type="text" class="time-box" id="outroM" placeholder="0" inputmode="numeric">
                <span class="time-sep">:</span>
                <input type="text" class="time-box" id="outroS" placeholder="0" inputmode="numeric">
            </div>
            <div class="input-hint" data-i18n="settings.outroHint"></div>
        </div>

        <button id="saveBtn" data-i18n="settings.save"></button>
        <button id="visualBtn" data-i18n="settings.visual"></button>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="section log-section">
        <div class="section-title" data-i18n="settings.log"></div>
        <div class="log" id="logContainer">
            <div class="empty-state" data-i18n="settings.emptyLog"></div>
        </div>
    </div>

    <script>translatePage()</script>
    <script src="settings.js"></script>
</body>
</html>
