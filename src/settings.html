<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="top-content">
        <div class="section">
            <div class="section-title">自动跳过</div>
            <div class="toggle-row">
                <label class="toggle-label">启用自动跳过</label>
                <label class="switch">
                    <input type="checkbox" id="enableToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="section">
            <div class="section-title">跳过片头</div>
            <div class="time-row">
                <input type="text" class="time-box" id="introH" placeholder="0" inputmode="numeric">
                <span class="time-sep">:</span>
                <input type="text" class="time-box" id="introM" placeholder="0" inputmode="numeric">
                <span class="time-sep">:</span>
                <input type="text" class="time-box" id="introS" placeholder="0" inputmode="numeric">
            </div>
        </div>

        <div class="section">
            <div class="section-title">跳过片尾</div>
            <div class="time-row">
                <input type="text" class="time-box" id="outroH" placeholder="0" inputmode="numeric">
                <span class="time-sep">:</span>
                <input type="text" class="time-box" id="outroM" placeholder="0" inputmode="numeric">
                <span class="time-sep">:</span>
                <input type="text" class="time-box" id="outroS" placeholder="0" inputmode="numeric">
            </div>
            <div class="input-hint">在结尾前停止</div>
        </div>

        <button id="saveBtn">保存设置</button>
        <button id="visualBtn">可视化设置</button>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="section log-section">
        <div class="section-title">跳过日志</div>
        <div class="log" id="logContainer">
            <div class="empty-state">暂无记录</div>
        </div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
